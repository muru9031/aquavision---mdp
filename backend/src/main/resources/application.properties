# ============================================================
# AquaVision AI - Spring Boot Application Configuration
# ============================================================

spring.application.name=aquavision-backend

# --- MySQL Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/aquavision_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Muruga@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080

# --- CORS (allow React dev server) ---
app.cors.allowed-origins=http://localhost:5173

# --- ML Microservice (Python FastAPI) ---
app.ml.service.base-url=http://localhost:8000

# --- Logging ---
logging.level.com.aquavision=DEBUG
logging.level.org.springframework.web=INFO

